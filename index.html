<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>傳統廠房式 AIDC 廠房動態管路總圖</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 React 與 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 載入 Babel 以解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // 內建圖示組件 (取代外部引入，確保單一檔案可完美運行)
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                Factory: <path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>,
                Server: <><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></>,
                Zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>,
                Activity: <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>,
                Wind: <><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></>,
                Droplets: <><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7 2.9 7 2.9s-2.15 5.25-2.29 6.16C3.57 10 3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 1 14 8.5c.85 1 1.5 2 1.5 3.5a3.5 3.5 0 0 1-5.04 3.14"/></>,
                Fan: <><path d="M10.827 16.379a6.082 6.082 0 0 1-8.618-7.002l5.412 1.45a6.082 6.082 0 0 1 7.002-8.618l-1.45 5.412a6.082 6.082 0 0 1 8.618 7.002l-5.412-1.45a6.082 6.082 0 0 1-7.002 8.618l1.45-5.412Z"/><path d="M12 12v.01"/></>,
                Settings: <><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>,
                ArrowRightLeft: <><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></>,
                ArrowRight: <><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></>,
                Info: <><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
          const [activeSystem, setActiveSystem] = useState('all');

          const systems = [
            { id: 'cooling', name: '冷卻動態路徑 (CWS/PCW/TCS)', color: 'border-blue-500', text: 'text-blue-400', bg: 'bg-blue-600' },
            { id: 'power', name: '電力動態路徑 (Busway)', color: 'border-yellow-500', text: 'text-yellow-400', bg: 'bg-yellow-600' },
            { id: 'safety', name: 'LDS 漏水偵測 (監控)', color: 'border-red-500', text: 'text-red-400', bg: 'bg-red-600' },
          ];

          return (
            <div className="flex flex-col gap-6 p-6 bg-slate-100 min-h-screen font-sans text-slate-800">
              
              <style dangerouslySetInnerHTML={{__html: `
                @keyframes flow {
                  from { stroke-dashoffset: 40; }
                  to { stroke-dashoffset: 0; }
                }
                @keyframes flow-reverse {
                  from { stroke-dashoffset: 0; }
                  to { stroke-dashoffset: 40; }
                }
                @keyframes spin-slow {
                  from { transform: rotate(0deg); }
                  to { transform: rotate(360deg); }
                }
                .animate-flow-fast { animation: flow 0.5s linear infinite; }
                .animate-flow-normal { animation: flow 1s linear infinite; }
                .animate-flow-slow { animation: flow 2s linear infinite; }
                .animate-flow-power { animation: flow-reverse 0.7s linear infinite; }
                .animate-spin-slow { animation: spin-slow 3s linear infinite; }
                .glow-blue { filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.8)); }
                .glow-cyan { filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.8)); }
                .glow-yellow { filter: drop-shadow(0 0 8px rgba(234, 179, 8, 0.8)); }
                .glow-red { filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.8)); }
              `}} />

              <header className="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 border-b border-slate-300 pb-4">
                <div>
                  <h1 className="text-3xl font-black text-slate-900 flex items-center gap-3">
                    <Icon name="Factory" className="text-indigo-600" size={32} /> AIDC 廠房動態管路總圖
                  </h1>
                  <p className="text-slate-600 mt-2 font-medium">
                    暗黑藍圖模式：展示水電分離佈線原則與動態流向，輕鬆掌握灰/白區對接介面。
                  </p>
                </div>
                <div className="flex flex-wrap gap-2">
                  {systems.map(s => (
                    <button 
                      key={s.id}
                      onClick={() => setActiveSystem(s.id)}
                      className={`px-4 py-2 rounded-lg text-xs font-bold transition-all border-2 ${activeSystem === s.id ? s.bg + ' text-white ' + s.color : 'bg-white text-slate-600 border-slate-200 hover:border-slate-400 shadow-sm'}`}
                    >
                      {s.name}
                    </button>
                  ))}
                  <button 
                    onClick={() => setActiveSystem('all')} 
                    className="px-4 py-2 rounded-lg text-xs font-bold bg-slate-800 text-white border-2 border-slate-800 hover:bg-slate-700 shadow-md"
                  >
                    顯示全系統
                  </button>
                </div>
              </header>

              <main className="relative w-full aspect-[16/9] min-h-[600px] bg-[#0f172a] rounded-2xl shadow-2xl overflow-hidden border-4 border-slate-700 select-none">
                
                <div className="absolute inset-0 opacity-10" style={{ backgroundImage: 'linear-gradient(#334155 1px, transparent 1px), linear-gradient(90deg, #334155 1px, transparent 1px)', backgroundSize: '40px 40px' }}></div>

                {/* 電力與行政區 */}
                <div className="absolute top-0 left-0 w-[25%] h-[35%] bg-yellow-900/10 border-r border-b border-slate-700 flex flex-col p-4">
                  <span className="text-xs font-black text-yellow-600/50 uppercase tracking-widest">Transformer Room</span>
                </div>
                <div className="absolute top-0 left-[25%] w-[25%] h-[35%] bg-yellow-900/5 border-r border-b border-slate-700 flex flex-col p-4">
                  <span className="text-xs font-black text-yellow-600/50 uppercase tracking-widest">UPS & Battery</span>
                </div>
                <div className="absolute top-0 left-[50%] w-[50%] h-[35%] bg-slate-800/20 border-b border-slate-700 flex flex-col p-4 items-end">
                  <span className="text-xs font-black text-slate-500 uppercase tracking-widest">NOC Control Center</span>
                </div>

                {/* 灰區與白區 */}
                <div className="absolute top-[35%] left-0 w-[30%] h-[65%] bg-blue-900/10 border-r-2 border-slate-600 flex flex-col p-4">
                  <span className="text-sm font-black text-blue-400/50 uppercase tracking-widest mb-1">Gray Space</span>
                  <span className="text-[10px] text-slate-500">Mechanical & Pumping</span>
                </div>
                <div className="absolute top-[35%] left-[30%] w-[70%] h-[65%] bg-slate-900 flex flex-col p-6">
                  <span className="text-xl font-black text-slate-700 uppercase tracking-[0.5em] text-center w-full absolute top-8 left-0">White Space (IT Hall)</span>
                </div>

                {/* 變壓器 */}
                <div className="absolute left-[12.5%] top-[17.5%] -translate-x-1/2 -translate-y-1/2 w-20 h-20 bg-slate-800 border-2 border-yellow-600/50 rounded flex flex-col items-center justify-center text-yellow-500 z-10 shadow-lg">
                  <Icon name="Zap" size={24} className="mb-1" />
                  <span className="text-[9px] font-bold">Main TX</span>
                </div>

                {/* UPS 機組 */}
                <div className="absolute left-[37.5%] top-[17.5%] -translate-x-1/2 -translate-y-1/2 w-32 h-20 bg-slate-800 border-2 border-yellow-600/50 rounded flex flex-col items-center justify-center text-yellow-500 z-10 shadow-lg p-2">
                  <span className="text-[9px] font-bold mb-1">UPS Bank</span>
                  <div className="flex gap-1 w-full h-full">
                    {[1,2,3,4].map(i => <div key={i} className="flex-1 bg-yellow-600/20 border border-yellow-600/30 rounded-sm"></div>)}
                  </div>
                </div>

                {/* 發電機 (戶外) */}
                <div className="absolute left-[92%] top-[20%] -translate-x-1/2 -translate-y-1/2 w-24 h-16 bg-slate-800 border-2 border-green-600/50 rounded flex flex-col items-center justify-center text-green-500 z-10 shadow-lg">
                  <Icon name="Activity" size={20} className="mb-1" />
                  <span className="text-[9px] font-bold">Generator</span>
                </div>

                {/* 冷卻水塔 (戶外) */}
                <div className="absolute left-[92%] top-[70%] -translate-x-1/2 -translate-y-1/2 w-24 h-24 bg-slate-800 border-2 border-blue-500/50 rounded-full flex flex-col items-center justify-center text-blue-400 z-10 shadow-lg">
                  <Icon name="Wind" size={24} className="mb-1" />
                  <span className="text-[9px] font-bold text-center">Cooling<br/>Tower</span>
                </div>

                {/* 冰機 Chiller */}
                <div className="absolute left-[15%] top-[55%] -translate-x-1/2 -translate-y-1/2 w-32 h-16 bg-slate-800 border-2 border-blue-500/50 rounded flex items-center justify-center gap-2 text-blue-400 z-10 shadow-lg">
                  <Icon name="Wind" size={18} className="animate-spin-slow" />
                  <span className="text-[10px] font-bold">Chiller Plant</span>
                </div>

                {/* CDU 模組 */}
                <div className="absolute left-[15%] top-[80%] -translate-x-1/2 -translate-y-1/2 w-40 h-20 bg-slate-800 border-2 border-cyan-600/50 rounded flex items-center justify-around text-cyan-400 z-10 shadow-lg p-2">
                  <div className="flex flex-col items-center">
                    <Icon name="Droplets" size={16} className="mb-1 text-blue-400" />
                    <span className="text-[8px] font-bold text-white">CDU-01</span>
                  </div>
                  <div className="h-full w-px bg-slate-600"></div>
                  <div className="flex flex-col items-center">
                    <Icon name="Droplets" size={16} className="mb-1 text-cyan-400" />
                    <span className="text-[8px] font-bold text-white">CDU-02</span>
                  </div>
                  <div className="absolute -top-3 right-2 bg-slate-700 text-slate-300 text-[8px] px-2 py-0.5 rounded border border-slate-600">熱交換核心</div>
                </div>

                {/* AI 機櫃群 (White Space) */}
                {[45, 60, 75].map((left, idx) => (
                  <div key={`r1-${idx}`} className="absolute top-[60%] -translate-x-1/2 -translate-y-1/2 w-16 h-24 bg-[#1e293b] border border-slate-600 rounded flex flex-col items-center justify-center text-slate-400 z-10 shadow-xl" style={{left: `${left}%`}}>
                    <Icon name="Server" size={20} className="mb-1" />
                    <span className="text-[8px] font-mono">NVL72</span>
                    <div className="absolute top-0 w-full h-1 bg-cyan-500/50 rounded-t"></div>
                  </div>
                ))}
                {[45, 60, 75].map((left, idx) => (
                  <div key={`r2-${idx}`} className="absolute top-[85%] -translate-x-1/2 -translate-y-1/2 w-16 h-24 bg-[#1e293b] border border-slate-600 rounded flex flex-col items-center justify-center text-slate-400 z-10 shadow-xl" style={{left: `${left}%`}}>
                    <Icon name="Server" size={20} className="mb-1" />
                    <span className="text-[8px] font-mono">NVL72</span>
                    <div className="absolute top-0 w-full h-1 bg-cyan-500/50 rounded-t"></div>
                  </div>
                ))}

                {/* SVG 管線路徑圖層 */}
                <svg viewBox="0 0 1600 900" className="absolute inset-0 w-full h-full z-20 pointer-events-none">
                  <defs>
                    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="blur" /><feComposite in="SourceGraphic" in2="blur" operator="over" /></filter>
                    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="blur" /><feComposite in="SourceGraphic" in2="blur" operator="over" /></filter>
                    <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="blur" /><feComposite in="SourceGraphic" in2="blur" operator="over" /></filter>
                  </defs>

                  {/* 1. 冷卻管路系統 */}
                  {(activeSystem === 'all' || activeSystem === 'cooling') && (
                    <g>
                      <path d="M 1472 630 L 1472 850 L 80 850 L 80 495 L 180 495" stroke="#1e3a8a" strokeWidth="12" fill="none" opacity="0.5" strokeLinejoin="round" />
                      <path d="M 1472 630 L 1472 850 L 80 850 L 80 495 L 180 495" stroke="#3b82f6" strokeWidth="4" strokeDasharray="16 16" fill="none" strokeLinejoin="round" className="animate-flow-normal glow-blue" />
                      <text x="750" y="835" className="fill-blue-400 text-xs font-bold tracking-widest">CWS 冷凝水迴路 (Facilities)</text>

                      <path d="M 240 520 L 240 680" stroke="#1d4ed8" strokeWidth="12" fill="none" opacity="0.5" />
                      <path d="M 240 520 L 240 680" stroke="#60a5fa" strokeWidth="4" strokeDasharray="12 12" fill="none" className="animate-flow-fast glow-blue" />
                      <text x="255" y="600" className="fill-blue-300 text-[10px] font-bold">PCW</text>

                      <path d="M 300 720 L 400 720 L 400 450 L 1200 450" stroke="#083344" strokeWidth="12" fill="none" opacity="0.8" strokeLinejoin="round" />
                      <path d="M 400 680 L 1200 680" stroke="#083344" strokeWidth="12" fill="none" opacity="0.8" />
                      
                      <path d="M 300 720 L 400 720 L 400 450 L 1200 450" stroke="#22d3ee" strokeWidth="4" strokeDasharray="16 16" fill="none" strokeLinejoin="round" className="animate-flow-fast glow-cyan" />
                      <path d="M 400 680 L 1200 680" stroke="#22d3ee" strokeWidth="4" strokeDasharray="16 16" fill="none" className="animate-flow-fast glow-cyan" />
                      
                      {[720, 960, 1200].map(x => (
                        <g key={`tcs-r1-${x}`}>
                          <path d={`M ${x} 450 L ${x} 500`} stroke="#22d3ee" strokeWidth="3" fill="none" strokeDasharray="8 8" className="animate-flow-fast" />
                        </g>
                      ))}
                      {[720, 960, 1200].map(x => (
                        <g key={`tcs-r2-${x}`}>
                          <path d={`M ${x} 680 L ${x} 720`} stroke="#22d3ee" strokeWidth="3" fill="none" strokeDasharray="8 8" className="animate-flow-fast" />
                        </g>
                      ))}

                      <text x="500" y="435" className="fill-cyan-400 text-xs font-bold tracking-widest">TCS 伺服器技術冷卻水 (Secondary Loop Header)</text>
                      
                      <circle cx="480" cy="450" r="12" fill="none" stroke="#ef4444" strokeWidth="3" className="animate-pulse" />
                      <circle cx="480" cy="680" r="12" fill="none" stroke="#ef4444" strokeWidth="3" className="animate-pulse" />
                      <text x="495" y="470" className="fill-red-400 text-[10px] font-bold">防震穿牆封堵</text>
                    </g>
                  )}

                  {/* 2. 電力系統路徑 */}
                  {(activeSystem === 'all' || activeSystem === 'power') && (
                    <g>
                      <path d="M 1472 150 L 1472 60 L 200 60 L 200 110" stroke="#422006" strokeWidth="10" fill="none" strokeLinejoin="round" />
                      <path d="M 1472 150 L 1472 60 L 200 60 L 200 110" stroke="#facc15" strokeWidth="3" strokeDasharray="12 12" fill="none" strokeLinejoin="round" className="animate-flow-power glow-yellow" opacity="0.6" />
                      <text x="800" y="50" className="fill-yellow-600 text-[10px] font-bold">Backup Power (11kV)</text>

                      <path d="M 240 157 L 520 157" stroke="#854d0e" strokeWidth="12" fill="none" opacity="0.5" />
                      <path d="M 240 157 L 520 157" stroke="#eab308" strokeWidth="6" strokeDasharray="15 15" fill="none" className="animate-flow-power glow-yellow" />
                      <text x="320" y="145" className="fill-yellow-500 text-[10px] font-bold">Main Feeder</text>

                      <path d="M 600 190 L 600 380 L 1200 380" stroke="#854d0e" strokeWidth="16" fill="none" opacity="0.4" strokeLinejoin="round" />
                      <path d="M 600 190 L 600 380 L 1200 380" stroke="#fef08a" strokeWidth="6" strokeDasharray="20 10" fill="none" strokeLinejoin="round" className="animate-flow-power glow-yellow" />
                      
                      {[740, 980, 1220].map(x => (
                        <path key={`pwr-${x}`} d={`M ${x} 380 L ${x} 500`} stroke="#fef08a" strokeWidth="2" strokeDasharray="6 6" fill="none" className="animate-flow-power" />
                      ))}

                      <text x="800" y="370" className="fill-yellow-400 text-xs font-black tracking-[0.2em] uppercase">Overhead Power Busway (匯流排)</text>
                      
                      <circle cx="600" cy="315" r="14" fill="none" stroke="#f59e0b" strokeWidth="3" />
                      <text x="620" y="320" className="fill-yellow-500 text-[10px] font-bold">防火穿層 (Firestop)</text>
                    </g>
                  )}

                  {/* 3. LDS 漏水偵測 */}
                  {(activeSystem === 'all' || activeSystem === 'safety') && (
                    <g>
                      <path d="M 300 735 L 415 735 L 415 465 L 1200 465" stroke="#ef4444" strokeWidth="2" strokeDasharray="4 4" fill="none" strokeLinejoin="round" className="glow-red animate-pulse" />
                      <path d="M 415 695 L 1200 695" stroke="#ef4444" strokeWidth="2" strokeDasharray="4 4" fill="none" className="glow-red animate-pulse" />
                      <text x="800" y="480" className="fill-red-400 text-[10px] font-bold">LDS Sensing Cable (沿水管下方佈建)</text>
                    </g>
                  )}
                </svg>

              </main>

              {/* 面試實戰：核心工程觀念圖解區 */}
              <section className="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-4">
                
                <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
                  <h4 className="text-xl font-black text-slate-800 border-b-2 border-slate-200 pb-3 mb-5 flex items-center gap-2">
                    <Icon name="Settings" className="text-slate-500" /> 空間與管線佈局重點
                  </h4>
                  <div className="space-y-6">
                    <div className="flex gap-4">
                       <div className="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center shrink-0">
                         <Icon name="Droplets" className="text-blue-600" size={20} />
                       </div>
                       <div>
                         <span className="font-bold text-slate-800 text-lg">水路配置：灰/白區的安全邊界</span>
                         <p className="text-sm text-slate-600 mt-1 leading-relaxed">
                           圖中藍色水路(PCW)只允許在灰區活動。透過 <strong>CDU (冷卻分配單元)</strong>，熱量被轉移，但水質被實體隔離。只有極高純度的青色水路(TCS)才能穿過紅色標示的「防震穿牆點」進入白區，保障伺服器安全。
                         </p>
                       </div>
                    </div>
                    <div className="flex gap-4">
                       <div className="w-10 h-10 rounded-full bg-yellow-100 flex items-center justify-center shrink-0">
                         <Icon name="Zap" className="text-yellow-600" size={20} />
                       </div>
                       <div>
                         <span className="font-bold text-slate-800 text-lg">電路配置：Busway 高密度微縮化</span>
                         <p className="text-sm text-slate-600 mt-1 leading-relaxed">
                           為支援高達 100kW+ 的機櫃，傳統電纜已被淘汰。圖中黃色路徑展示了 <strong>Busway (匯流排)</strong> 的走法。它通常採「上走線」，並與水管(TCS)保持絕對的立體錯位（水下、電上），避免漏水引發短路。
                         </p>
                       </div>
                    </div>
                  </div>
                </div>

                <div className="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col justify-between">
                  <div>
                    <h4 className="text-xl font-black text-white border-b-2 border-slate-600 pb-3 mb-5 flex items-center gap-2">
                      <Icon name="ArrowRightLeft" className="text-cyan-400" /> 熱交換：PCW 與 TCS 是如何對接？
                    </h4>
                    <p className="text-sm text-slate-300 leading-relaxed mb-6">
                      在 CDU 內部，廠務冷卻水(PCW)與技術冷卻水(TCS)是<strong>「絕對不互通」</strong>的。它們透過內部的「板式熱交換器」進行純物理的熱量傳遞。
                    </p>
                    
                    <div className="bg-slate-900 rounded-xl p-4 flex items-center justify-between border border-slate-700">
                       <div className="text-center w-1/3">
                          <div className="text-blue-400 font-black text-sm mb-1">PCW (一次側)</div>
                          <div className="text-xs text-slate-400">廠務粗水 16°C</div>
                       </div>
